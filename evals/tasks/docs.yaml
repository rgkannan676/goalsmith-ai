# Questions answered from the eval corpus (evals/retrieval/corpus) with search_docs.

- id: docs-parental-leave
  tags: [smoke, docs]
  needs: [docs]
  goal: How many weeks of paid parental leave do new parents get at Lumen Labs, and how much notice must they give?
  checks:
    answer_contains: ["18", ["8 weeks", "eight weeks"]]
    min_citations: 1
    tools_called: [search_docs]
  rubric: grounded_answer

- id: docs-error-code
  tags: [smoke, docs]
  needs: [docs]
  goal: My Beacon sensor shows error E-1042. What does it mean and how do I fix it?
  checks:
    answer_contains: [["2.4 GHz", "2.4ghz"], "Wi-Fi"]
    min_citations: 1
    tools_called: [search_docs]
  rubric: grounded_answer

- id: docs-not-in-corpus
  tags: [smoke, docs]
  needs: [docs]
  goal: What is Lumen Labs' policy on bringing dogs to the office?
  checks:
    tools_called: [search_docs]
  rubric: grounded_answer
  criteria:
    - The answer says clearly that the documents do not cover this, instead of guessing a policy.

- id: docs-travel-costs
