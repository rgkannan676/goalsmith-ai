[project]
name = "goalsmith"
version = "0.1.0"
description = "From goal to done. A multi-agent workbench that plans, researches, analyses and acts with RAG, MCP tools and pluggable skills."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.9.1",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.7.6",
    "langgraph>=1.2.20",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "rich>=15.0.0",
    "tavily-python>=0.8.5",
    "typer>=0.28.0",
]

[project.scripts]
goalsmith = "goalsmith.cli:app"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "ASYNC",    # async pitfalls
    "BLE",      # no blind `except Exception`
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["goalsmith", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["tavily", "tavily.*"]  # ships without type hints
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Docker Compose services (run with `make up` first)",
]
