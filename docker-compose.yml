# Local services. Start with `make up`, stop with `make down`.
# Later milestones add Postgres (M4), Langfuse (M5) and Redis (M13).
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0  # keep the minor version in step with qdrant-client
    ports:
      - "6333:6333"  # REST API and dashboard: http://localhost:6333/dashboard
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has no curl, so open a TCP connection with bash instead.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  qdrant_data:
