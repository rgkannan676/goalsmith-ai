# Local services. Start with `make up`, stop with `make down`.
# Later milestones add Langfuse (M5) and Redis (M13).
# Ports are bound to 127.0.0.1 so the services are not reachable from your network.
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0  # keep the minor version in step with qdrant-client
    ports:
      - "127.0.0.1:6333:6333"  # REST API and dashboard: http://localhost:6333/dashboard
      - "127.0.0.1:6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has no curl, so open a TCP connection with bash instead.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    # Postgres 18 with the pgvector extension: run checkpoints and long-term memory.
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: goalsmith
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goalsmith}  # local dev only; override in .env
      POSTGRES_DB: goalsmith
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql  # Postgres 18 keeps its data in a versioned subfolder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goalsmith -d goalsmith"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  qdrant_data:
  postgres_data:
